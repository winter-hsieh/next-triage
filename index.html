<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="下一位：Triage — 急診檢傷模擬遊戲（Emergency Department Triage Simulator）">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>下一位：Triage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 單螢幕三欄檢傷台（候診佇列｜問診｜檢傷單），上方常駐班次狀態列；窄螢幕改成直向堆疊。
   刻意只做深色：醫療資訊系統感，讓計時器與顏色變化是最顯眼的元素。 */
:root{
  color-scheme: dark;
  --bg:#0c131a; --panel:#121c26; --panel2:#182532; --line:#24364a; --line2:#2f455c;
  --fg:#e5edf4; --muted:#8aa0b3; --dim:#5d7387;
  --accent:#5ec4d4; --accent-ink:#06222a;
  --warn:#f0c24f; --orange:#f08b3d; --crit:#ef5252; --ok:#5cc98c;
  --t1:#3f7ee3; --t2:#e14a4a; --t3:#e7c43f; --t4:#4fb874; --t5:#e8edf1;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
  --fig-p:#5f7a96; --fig-n:#3f9aa8; --fig-f:#8a7560; --fig-i:#b0524f; --desk:#1e2c3a;
  --head:#d6c0a9; --head-pale:#e6e0da; --head-grey:#b9c4ca;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;min-height:560px;padding-block:12px;gap:10px;pointer-events:none}
.app>*{pointer-events:auto}

/* 狀態列 */
.bar{display:flex;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;align-items:center;gap:8px 18px;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px}
.brand{font-weight:900;font-size:18px;letter-spacing:.04em;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.12em}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat b{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat>span{font-size:10.5px;color:var(--muted);letter-spacing:.12em}
.clock b{color:var(--accent);font-size:24px}
.bar .grow{flex:1}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.ai{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.ctl{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);padding:5px 10px;font-size:12.5px}
.ctl:hover{border-color:var(--accent)}
.ctl[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* 三欄 */
.desk{flex:none;margin-top:auto;height:clamp(330px,50vh,640px);min-height:0;display:grid;grid-template-columns:minmax(230px,280px) minmax(0,1fr) minmax(260px,320px);gap:10px}
.col{background:color-mix(in srgb,var(--panel) 91%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;min-width:0}
.colhead{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:11.5px;letter-spacing:.14em;color:var(--muted)}
.scroll{overflow-y:auto;min-height:0}

/* 佇列卡 */
.queue{flex:1;padding:8px;display:flex;flex-direction:column;gap:8px}
.card{text-align:left;background:var(--panel2);border:1px solid var(--line2);border-left:5px solid var(--dim);border-radius:var(--r);padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%}
.card:hover{border-color:var(--accent);border-left-color:inherit}
.card.s1{border-left-color:var(--warn)} .card.s2{border-left-color:var(--orange)} .card.s3{border-left-color:var(--crit);animation:pulse 1.2s infinite}
.card.active{outline:2px solid var(--accent)}
.card .who{font-weight:700}
.card .cc{grid-column:1/-1;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .wait{font-family:var(--mono);font-size:13px;color:var(--fg)}
.card.s2 .wait,.card.s3 .wait{color:var(--crit)}
@keyframes pulse{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--crit) 35%,transparent)}}
@media (prefers-reduced-motion:reduce){.card.s3{animation:none}}
.done{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px;max-height:38%}
.doneitem{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.chip{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;color:#111}
.c1{background:var(--t1);color:#fff}.c2{background:var(--t2);color:#fff}.c3{background:var(--t3)}.c4{background:var(--t4)}.c5{background:var(--t5)}
.empty{color:var(--dim);font-size:12.5px;padding:10px;text-align:center}

/* 問診區 */
.pthead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.pthead h2{margin:0;font-size:17px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.pthead h2 small{font-size:12.5px;color:var(--muted);font-weight:400}
.look{font-size:12.5px;color:var(--warn)}
.chat{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:8px 11px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.msg .from{display:block;font-size:10.5px;letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
.msg.nurse{align-self:flex-end;background:color-mix(in srgb,var(--accent) 18%,var(--panel2));border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.msg.patient{align-self:flex-start;background:var(--panel2);border:1px solid var(--line2)}
.msg.family{align-self:flex-start;background:color-mix(in srgb,var(--orange) 10%,var(--panel2));border:1px dashed color-mix(in srgb,var(--orange) 55%,transparent);margin-left:22px}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12px;font-family:var(--mono);text-align:center;padding:2px 8px}
.msg.thinking{color:var(--muted);font-style:italic}
.quick{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:8px 14px 2px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
.quick::-webkit-scrollbar{display:none}
.quick.atend{-webkit-mask-image:none;mask-image:none}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
.quick button{flex:none}
.quick button{background:none;border:1px solid var(--line2);border-radius:99px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.quick button:hover{color:var(--fg);border-color:var(--accent)}
.ask{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap}
.ask input{flex:1;min-width:160px;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:9px 11px}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r);padding:9px 16px;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line2);font-weight:500}
.btn .cost{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}
.idle{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;color:var(--muted);text-align:center;padding:24px}
.idle .big{font-size:40px;font-weight:900;color:var(--line2);letter-spacing:.1em}

/* 檢傷單 */
.form{padding:12px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.vitals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vital{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:5px 7px}
.vital span{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em}
.vital b{font-family:var(--mono);font-size:15px;font-weight:600}
.vital b.abn{color:var(--crit)}
select{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:8px}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.lv{border:2px solid var(--line2);background:var(--bg);border-radius:var(--r);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px}
.lv b{font-family:var(--mono);font-size:18px}
.lv span{font-size:10.5px;color:var(--muted)}
.lv[aria-checked="true"]{border-color:currentColor;background:color-mix(in srgb,currentColor 16%,var(--bg))}
.lv.l1{color:var(--t1)}.lv.l2{color:var(--t2)}.lv.l3{color:var(--t3)}.lv.l4{color:var(--t4)}.lv.l5{color:var(--t5)}
.note{font-size:11.5px;color:var(--dim)}
.toast{font-size:12.5px;color:var(--ok);min-height:1.2em}
.term{background:none;border:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;border-bottom:1px dotted currentColor;cursor:help}
.term:hover{color:var(--accent)}
.pop{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 72%,transparent);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.popcard{background:var(--panel2);border:1px solid var(--accent);border-radius:10px;max-width:460px;width:100%;padding:18px 20px;display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow-y:auto}
.popcard.alarm{border-color:var(--crit)}
.popcard h3{margin:0;font-size:16px}
.popcard p{margin:0;line-height:1.75}
.popcard .note{color:var(--muted)}
.glist{display:flex;flex-wrap:wrap;gap:6px}
.glist button{background:var(--bg);border:1px solid var(--line2);border-radius:99px;padding:4px 11px;font-size:13px}
.glist button:hover{border-color:var(--accent)}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{text-align:left;line-height:1.5}
.dest{font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.dest b{color:var(--fg)}
.know{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.know .rule p{color:var(--fg)}
.links{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.links a{color:var(--accent)}
.fb{display:flex;flex-direction:column;gap:8px}
.fb textarea,.fb input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:8px 10px;resize:vertical}
a.btn{display:inline-block;text-decoration:none}
a.btn[aria-disabled]{opacity:.4;cursor:not-allowed}
button.btn:disabled{opacity:.4}
.aif{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.aif input,.aif select{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:8px;color:var(--fg);font-size:14px}
.popcard a{color:var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.tut-hl{outline:3px solid var(--accent)!important;outline-offset:3px;animation:tutpulse 1.4s ease-in-out infinite}
@keyframes tutpulse{50%{outline-color:color-mix(in srgb,var(--accent) 35%,transparent)}}
.tut-card{position:fixed;z-index:45;width:min(360px,calc(100vw - 32px));background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tut-card h3{margin:0;font-size:16px}
.tut-card p{margin:0;line-height:1.75}
.tut-card .step{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.tut-card.center{left:50%;top:50%;transform:translate(-50%,-50%)}
@media (prefers-reduced-motion:reduce){.tut-hl{animation:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend b{font-family:var(--mono)}

/* 覆蓋層 */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 45%,transparent);backdrop-filter:blur(2px);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;z-index:20;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:10px;max-width:860px;width:100%;padding:26px 28px;display:flex;flex-direction:column;gap:16px;margin:auto 0}
.sheet h1{margin:0;font-size:44px;font-weight:900;letter-spacing:.06em;line-height:1.1}
.sheet h1 .ecg{color:var(--accent)}
.sheet .subt{margin-top:6px;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sheet h3{margin:0;font-size:15px;letter-spacing:.06em}
.sheet p{margin:0;color:var(--muted);text-wrap:pretty}
.sheet .lead{color:var(--fg);font-size:16px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rule{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--panel2)}
.rule b{display:block;margin-bottom:3px}
.rule p{font-size:13px}
.ttasrow{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.disc{font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:10px}
.sheet p.disc{max-width:none}
.verdict{display:flex;flex-direction:column;gap:4px}
.verdict .vt{font-size:26px;font-weight:900;color:var(--accent);letter-spacing:.04em}
.verdict .vd{font-size:15px;font-weight:500}
.verdict .note{font-weight:400}
.alarm{border-color:var(--crit);box-shadow:0 0 0 4px color-mix(in srgb,var(--crit) 25%,transparent)}
.alarm h1{color:var(--crit);font-size:34px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:500}
td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.grade{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.grade .g{font-family:var(--mono);font-size:72px;font-weight:600;line-height:1;color:var(--accent)}
.grade .total{font-family:var(--mono);font-size:28px}
.neg{color:var(--crit)} .pos{color:var(--ok)}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);padding:8px 12px}
details summary{cursor:pointer;font-weight:500}
details .tr{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.tr .turn{color:var(--muted)} .tr .turn.hit{color:var(--warn)}
.verdict{font-size:18px;font-weight:700;border-left:4px solid var(--accent);padding:6px 12px;background:var(--panel2)}
.bias{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.bias .grp{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.bias .grp b{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:4px}
.bias .row{display:flex;justify-content:space-between;font-size:13px}

/* 3D 場景 */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:#d5dee3}
.app.noanim .desk{flex:1;height:auto;margin-top:0}
.scene canvas{display:block;width:100%;height:100%}
.scene.shake{animation:shake .35s 3}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:var(--orange)}
.flash.go{animation:flashO .9s}
.screenflash{position:fixed;inset:0;pointer-events:none;z-index:15;background:var(--crit);opacity:0;animation:sf 2.4s forwards}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes flashO{0%{opacity:0}20%{opacity:.28}100%{opacity:0}}
@keyframes sf{0%{opacity:0}20%{opacity:.35}40%{opacity:0}60%{opacity:.35}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.scene.shake{animation:none}.screenflash{display:none}}

@media (max-width:900px){
  .scene{position:relative;inset:auto;height:240px}
  .app{height:auto}
  .desk{grid-template-columns:minmax(0,1fr);height:auto;margin-top:0}
  .queue{max-height:260px}
  .chat{min-height:280px;max-height:55vh}
  .sheet{padding:20px 16px}
  .sheet h1{font-size:34px}
}
</style>

<div id="scene" class="scene" hidden></div>
<div class="app" id="app">
  <header class="bar">
    <div class="brand">下一位：Triage <small>EMERGENCY DEPARTMENT TRIAGE SIMULATOR</small></div>
    <div class="stat clock"><b id="clock">22:00</b><span><button class="term" data-term="clock" type="button">班次時鐘</button></span></div>
    <div class="stat"><b id="left">90</b><span>剩餘分鐘</span></div>
    <div class="stat"><b><span id="bedsR">2</span> · <span id="bedsT">4</span></b><span><button class="term" data-term="beds" type="button">空床 急救·診療</button></span></div>
    <div class="stat"><b id="doneN">0/8</b><span>已檢傷</span></div>
    <div class="grow"></div>
    <button class="ctl" id="aiBtn" hidden>AI 設定</button>
    <button class="ctl" id="glossBtn">名詞解釋</button>
    <button class="ctl" id="animBtn" aria-pressed="true" title="開關場景動畫">動畫</button>
    <button class="ctl" id="endBtn">提早結算</button>
    <button class="ctl" id="speedBtn" aria-pressed="false" title="時間流速">×2 流速</button>
    <button class="ctl" id="pauseBtn">暫停</button>
  </header>

  <main class="desk">
    <section class="col" aria-label="候診佇列">
      <div class="colhead"><span>候診佇列</span><span class="mono" id="qcount">0</span></div>
      <div class="queue scroll" id="queue"></div>
      <div class="done scroll" id="done"><div class="empty">尚未完成檢傷</div></div>
    </section>

    <section class="col" aria-label="問診區">
      <div id="ptHead" class="pthead" hidden></div>
      <div id="idle" class="idle"><div class="big">下一位</div><div>從左側候診佇列點一位病患叫號，開始問診。</div><div class="note">卡片左緣顏色是<button class="term" data-term="look" type="button">外觀線索</button>，不是檢傷級數。看不懂的詞點虛線字。</div></div>
      <div id="chat" class="chat scroll" hidden aria-live="polite"></div>
      <div id="quick" class="quick" hidden></div>
      <form id="askForm" class="ask" hidden>
        <input id="askInput" autocomplete="off" placeholder="輸入你要問的問題，例如：痛多久了？" maxlength="200">
        <button class="btn" id="askBtn" type="submit">問<span class="cost">30秒</span></button>
        <button class="btn ghost" id="vitalBtn" type="button">量生命徵象<span class="cost">2分</span></button>
        <button class="btn ghost" id="lookBtn" type="button">檢視外觀<span class="cost">30秒</span></button>
      </form>
    </section>

    <section class="col" aria-label="檢傷單">

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* 每班從案例池抽 9 位：4 位一二級、2 位三級、3 位四五級，到院時間隨機 */
function pickCases(){
  const hi=shuffle(CASES.filter(c=>c.trueLevel<=2)), mid=shuffle(CASES.filter(c=>c.trueLevel===3)), lo=shuffle(CASES.filter(c=>c.trueLevel>=4));
  const pick=[...lo.slice(0,1), ...shuffle([...hi.slice(0,4),...mid.slice(0,2),...lo.slice(1,3)])];
  let t=0; return pick.map((c,i)=>({...c, arrive: i===0?0:(t+=2+Math.floor(Math.random()*4))}));
}

const $ = id=>document.getElementById(id);
function el(tag, attrs, ...kids){
  const e=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==="class") e.className=v; else if(k==="text") e.textContent=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v===true?"":v);
  }
  for(const k of kids.flat()) if(k!=null&&k!==false) e.append(k.nodeType?k:String(k));
  return e;
}
const pad=n=>String(n).padStart(2,"0");
function clockStr(sec){ const m=Math.floor(sec/60)+START_H*60+START_M; return pad(Math.floor(m/60)%24)+":"+pad(m%60); }
function mmss(sec){ sec=Math.max(0,Math.floor(sec)); return pad(Math.floor(sec/60))+":"+pad(sec%60); }
const arriveSec = p=>p.c.arrive*60;
function seenOrNow(p){ return p.seenAt!=null && p.seenAt<=S.t ? p.seenAt : S.t; }
function stageOf(p){
  if(p.collapsed) return 3;
  const el_=(seenOrNow(p)-arriveSec(p))/60; let s=0;
  for(const d of p.c.det){ if(!d.collapse && el_>=d.after) s=Math.max(s,d.stage); }
  const col=p.c.det.find(d=>d.collapse);
  if(col && el_>=col.after-5 && s>=1) s=2;
  return s;
}
function lookText(p){ const L=p.c.looks; return L[Math.min(stageOf(p),L.length-1)]; }
function vitalsOf(p){ return (stageOf(p)>=1 && p.c.vitals2)? p.c.vitals2 : p.c.vitals; }
function famName(p){ return p.c.family? p.c.family.who : ""; }

/* ============ 時間推進與事件 ============ */
function advance(sec){
  const target=S.t+sec;
  // 逐步推進，確保倒下事件依序觸發
  while(S.t<target && !S.ended){
    S.t=Math.min(target, S.t+15);
    for(const p of S.pts){
      if(!p.arrived && S.t>=arriveSec(p)){ p.arrived=true; p.status="waiting"; }
      if(p.status==="triaged" && p.seenAt!=null && S.t>=p.seenAt) p.status="seen";
    }
    for(const p of S.pts){
      if(!p.arrived||p.collapsed) continue;
      const col=p.c.det.find(d=>d.collapse); if(!col) continue;
      const seen = p.seenAt!=null && p.seenAt<=S.t;
      const collapseAt=arriveSec(p)+col.after*60;
      if(!seen && S.t>=collapseAt && (p.seenAt==null || p.seenAt>collapseAt)){ triggerCollapse(p); return; }
    }
    if(S.t>=SHIFT_MIN*60){ endShift(); return; }
  }
  // 子彈時間：全部到齊且都已檢傷 → 交班
  if(S.pts.every(p=>p.arrived && p.status!=="waiting" && p.status!=="interview")) { endShift(); return; }
}
function loop(){
  const now=performance.now(); const dt=(now-lastReal)/1000; lastReal=now;
  if(S && S.running && !S.busy && !S.ended && document.visibilityState==="visible"){
    advance(dt*RATE*S.speed); checkEvents();
  }
  renderLive();
}
function startLoop(){ lastReal=performance.now(); clearInterval(tickTimer); tickTimer=setInterval(loop,250); }

function takeBed(kind, from){
  const arr=S.beds[kind]; let i=0;
  for(let k=1;k<arr.length;k++) if(arr[k]<arr[i]) i=k;
  const at=Math.max(from, arr[i]); arr[i]=at+BED_HOLD*60; return at;
}
function bedsFree(kind){ return S.beds[kind].filter(f=>f<=S.t).length; }

function triggerCollapse(p){
  p.collapsed=true; p.collapsedAt=S.t; p.status="seen"; screenFlash();
  const wasCur = S.cur===p;
  p.seenAt=S.t; takeBed("resus", S.t);
  if(!p.triage) p.triage={level:null,cat:"",dest:"resus",at:S.t,forced:true};
  else p.triage.forcedFrom=p.triage.level;
  p.log.push({who:"sys",text:"⚠ "+clockStr(S.t)+" 候診區倒下，轉一級送急救區"});

    el("p",{text:`病患${where}。到診至今 ${Math.round((S.t-arriveSec(p))/60)} 分鐘。已強制轉為一級、推入急救區。這筆會列入交班報告。`}),

function callPatient(p){
  if(S.busy||S.ended) return;
  if(S.cur && S.cur!==p && S.cur.status==="interview") S.cur.status="waiting";
  S.cur=p; p.status="interview"; S.selLevel=null;
  $("toast").textContent="";
  if(!p.called){
    p.called=true;
    const fam=p.c.family;
    const ccFromFam=p.c.cc.startsWith("（");
    const text=p.c.cc.replace(/^（.+?）/,"");
    p.log.push({who:"sys",text:clockStr(S.t)+" 叫號："+p.c.name});
    p.log.push({who:"nurse",text:"你好，我是檢傷護理師。今天怎麼了？"});
    p.log.push({who:ccFromFam?"family":"patient",text});
    if(fam && !ccFromFam && fam.type==="焦慮施壓型") p.log.push({who:"family",text:fam.lines[0]});
    for(const cl of p.c.clues) if(cl.vol) p.revealed.add(cl.id);
  }
  if(p.attitude && !p.attSaid && ATT_OPEN[p.attitude]){ p.attSaid=true; p.log.push({who:p.c.family?"family":"patient",text:ATT_OPEN[p.attitude]}); }
  render(); setTimeout(()=>$("askInput").focus(),0);
}

function expandQ(q){ let x=q; for(const [re,add] of SYN) if(re.test(q)) x+=" "+add; return x; }
const EMPATHY_REPLY=["……謝謝你。","好，我知道了，謝謝。","嗯……聽你這樣說比較安心一點。","謝謝，不好意思麻煩你們。"];
function offlineReply(p,q0){
  const q=expandQ(q0);
  const out={patient:"",family:"",revealed:[]};
  const hits=p.c.clues.filter(cl=>!cl.vol && !p.revealed.has(cl.id) && cl.kw && cl.kw.some(k=>q.includes(k)) && !(cl.volTurn));
  const again=p.c.clues.filter(cl=>p.revealed.has(cl.id) && cl.kw && cl.kw.some(k=>q.includes(k)));
  const pLines=[], fLines=[];
  for(const cl of hits.slice(0,2)){ (cl.who==="family"?fLines:pLines).push(cl.line); out.revealed.push(cl.id); }
  if(!hits.length && again.length){ const cl=again[0]; (cl.who==="family"?fLines:pLines).push("剛剛說過了啊，"+cl.line); }
  const kind=/辛苦|了解|理解|擔心|抱歉|不好意思|放心|我知道|別怕|不要怕|會幫|馬上/.test(q0);
  if(!pLines.length && !fLines.length){
    if(q0.trim().length<2) pLines.push("嗯？你說什麼？");
    else if(kind) pLines.push(EMPATHY_REPLY[Math.floor(Math.random()*EMPATHY_REPLY.length)]);
    else if(/幾分|分數|0到10|1到10|多痛|痛不痛/.test(q0)) pLines.push(p.c.loud?"十分！很痛啦！":"……大概五、六分吧，還忍得住。");
    else { const f=p.c.filler; let i=Math.floor(Math.random()*f.length); if(f.length>1&&i===p.lastFill) i=(i+1)%f.length; p.lastFill=i; pLines.push(f[i]); }
  }
  // 家屬「應該被相信」主動插話
  const vt=p.attitude==="scold"? null : p.c.clues.find(cl=>cl.volTurn && !p.revealed.has(cl.id) && p.turns+1>=cl.volTurn);
  if(vt){ fLines.push(vt.line); out.revealed.push(vt.id); }
  // 焦慮與施壓
  const fam=p.c.family;
  if(/辛苦|了解|理解|擔心|抱歉|不好意思|放心|我知道|別怕|不要怕|會幫|馬上/.test(q)) p.anx=Math.max(0,p.anx-18); else p.anx=Math.min(100,p.anx+4);
  if(fam && !fLines.length && fam.type==="焦慮施壓型" && p.anx>50 && Math.random()<.5) fLines.push(fam.lines[p.famI++%fam.lines.length]);
  if(fam && !fLines.length && /家屬|先生|太太|媽媽|女兒|同學|你們|妳覺得|你覺得/.test(q)) fLines.push(fam.lines[p.famI++%fam.lines.length]);
  out.patient=pLines.join(" "); out.family=fLines.join(" ");
  // 由家屬代訴的病患本人（意識不清）
  if(p.c.id==="sepsis_m78" && !out.patient) out.patient=p.c.filler[p.fillerI++%p.c.filler.length].replace(/^（.+?）/,"");
  out.cost=COST.ask; out.anxiety=p.anx;
  return out;
}

【台灣急診病人的真實樣子（自然融入，不要每句都用）】
- 用日常話形容症狀：「悶悶的」「怪怪的」「頭殼暈」「沒力」「刺刺的」，不用醫學名詞。
- 長輩常淡化：「沒事啦」「不要麻煩你們」；年輕人可能誇大，或一直問要等多久。
- 會先講自己猜的原因（吃壞肚子、閃到腰、感冒、喝多了）；會問「可以先拿藥嗎」「要等多久」。
- 聽不懂醫學詞：被問「抗凝血劑」會說「心臟科開的、血液稀釋的藥」；被問「病史」會講具體的病，例如「血壓高」「糖尿病」。
- 家屬會插話、補充或打斷；小孩由家長代答；意識不清、喘或酒醉的人講話破碎、短。

【已經說出過的線索】${[...p.revealed].join(", ")||"（無）"}

【規則】
1. 繁體中文、台灣口語，像真實的人在急診說話。病人每次回答 2–4 句，要帶出具體細節（什麼時候、在哪裡、當時在做什麼、身體的感覺、生活背景），不要只回一句話或只回「嗯」。可以有語助詞、停頓、重複。
1-1. 有家屬在場時，家屬是對話的一部分：病人說不清楚（意識不清、太喘、太小、酒醉、講話含糊），或線索標明「由家屬說」時，family 一定要由家屬完整回答（2–4 句），patient 只放病人發出的片段、聲音或動作（例如「（喘著氣）……還好……」「（一直哭）媽媽……」）。病人淡化症狀時，家屬會補充或糾正。patient 和 family 不要同時空白。
2. 角色不知道自己的診斷，絕不說出任何疾病名稱、檢傷級數或「應該幾級」。被問到就照角色自己的想法回答。

async function ask(q){

  q=q.trim(); if(!q) return;
  p.log.push({who:"nurse",text:q}); p.turns++; play("#figN","talk");
  let r=null;
  if((aiState==="ai" && sample) || byokReady()){
    S.busy=true; render(); showThinking(p);
    try{
      S.aiCalls++;
      const j=await aiJSON(buildPrompt(p,q));
      const allowed=new Set(p.c.clues.map(c=>c.id));
      r={patient:String(j.patient||"").slice(0,400), family:p.c.family?String(j.family||"").slice(0,400):"",
         revealed:(Array.isArray(j.revealed_clues)?j.revealed_clues:[]).map(String).filter(id=>allowed.has(id)),
         anxiety:Number.isFinite(+j.anxiety)?Math.max(0,Math.min(100,Math.round(+j.anxiety))):p.anx,
         cost:Math.max(15,Math.min(90,Math.round(+j.turn_cost_seconds)||COST.ask))};

      else if(e&&e.code==="rate_limited"){ flash("AI 呼叫太頻繁或額度用完，這一回合改用離線腳本"); }
      else if(e&&!sample){ flash("AI 沒有回應（"+errText(e)+"），這一回合改用離線腳本"); }
      r=null;
    }finally{ S.busy=false; lastReal=performance.now(); }

  if(!r) r=offlineReply(p,q);

}

function endShift(){
  if(S.ended) return; S.ended=true; S.running=false; clearInterval(tickTimer);
  // 交班後推算：仍在候診區的病患，是否會在被看到之前倒下
  for(const p of S.pts){
    if(!p.arrived||p.collapsed) continue;
    const col=p.c.det.find(d=>d.collapse); if(!col) continue;
    const at=arriveSec(p)+col.after*60;
    if(p.triage && p.seenAt>at){ p.collapsed=true; p.collapsedAt=at; p.afterShift=true; }
  }
  render(); showResults();
}
const PTS={"0":100,"-1":70,"-2":40,"1":20,"2":0};
function scoreOf(){
  let total=0, collapses=0; const arrived=S.pts.filter(p=>p.arrived), max=arrived.length*100;
  for(const p of arrived){
    const tl=p.c.trueLevel;
    const playerLv = p.triage && !p.triage.forced ? (p.triage.forcedFrom ?? p.triage.level) : null;
    p.playerLv=playerLv; p.items=[];
    if(playerLv==null){ p.d=null; p.items.push(["沒有完成檢傷",0]); }
    else{ const d=playerLv-tl; p.d=d; const k=String(Math.max(-2,Math.min(2,d)));
      p.items.push([d===0?"分級正確":d<0?`高估 ${-d} 級`:`低估 ${d} 級`, PTS[k]]); }
    const end = p.collapsed? p.collapsedAt : (p.seenAt!=null? p.seenAt : S.t);
    p.waitMin=(end-arriveSec(p))/60;
    if(p.waitMin>ALLOWED[tl]+3) p.items.push(["超過建議看診時間",-10]);
    if(p.collapsed){ collapses++; p.items.push(["倒下",-50]); }
    p.pts=p.items.reduce((a,x)=>a+x[1],0); total+=p.pts;
  }
  const pct=max? total/max : 0;
  let gi = pct>=0.9?0: pct>=0.75?1: pct>=0.55?2: pct>=0.35?3:4;
  if(collapses) gi=Math.min(4,gi+1);
  const fam=arrived.filter(p=>p.c.family && p.called);
  return {total,max,grade:"SABCD"[gi],collapses,famAvg:fam.length?Math.round(fam.reduce((a,p)=>a+p.anx,0)/fam.length):null};
}
function fmtD(x){ if(Math.abs(x)<0.05) return "平均誤差 0"; return (x>0?"平均低估 ":"平均高估 ")+Math.abs(x).toFixed(1)+" 級"; }
function biasSlices(){

async function byokCall(prompt,cfg){

    const t=parts.map(x=>x.text||"").join("");

  const t=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");

  {sel:".bar", title:"班次時鐘", text:"最左邊是遊戲裡的時間，一開始就會一直往前走。病人在候診區等越久，有些人會越來越嚴重。旁邊依序是剩下幾分鐘、空床數、已經檢傷幾位。"},
  {sel:"main.desk > section:nth-of-type(1)", title:"① 點病人，叫號", text:"病人到院後會排在這裡。點一張卡片，就是叫這位病人來問診。卡片左邊的顏色是他「看起來」的樣子：灰色還好，黃、橙、紅越來越不妙。右上角是他等了多久。"},
  {sel:"main.desk > section:nth-of-type(2)", title:"② 問診", text:"叫號後，對話會出現在這裡。病人會先說哪裡不舒服，你可以點下面的快捷問句，或自己打字問。每問一句會花 30 秒。按「量生命徵象」（2 分鐘）可以看血壓、心跳等數值。"},
  {sel:"main.desk > section:nth-of-type(3)", title:"③ 給級數、送出", text:"量過的數值會出現在上面，紅字代表異常。問得差不多了，選 1 到 5 級（1 最緊急、5 最不急），再按「完成檢傷」。系統不會當場告訴你對錯，結算時才會揭曉。"},
  {sel:"#levels", title:"拿不準時，判重一點", text:"判太重只會少一點分；判太輕會扣很多分，嚴重的話病人會在候診區倒下。不確定的時候，往緊急的那邊選。"},
  {sel:"#glossBtn", title:"看不懂就點這裡", text:"「名詞解釋」可以查血壓、TTAS 這些詞，畫面上有虛線的字也能點。想結束可以按「提早結算」。看說明時遊戲時間會暫停。"},
  {sel:null, title:"開始值班吧！", text:"第一位病人已經在候診佇列了，點他的卡片開始問診。結算時會告訴你每位病人的真實級數，還有你漏問了哪一句。"}
];
function tutSeen(){ try{ return localStorage.getItem("np_tut")==="1"; }catch(_){ return false; } }
function startShift(withTut){
  hideOverlay(); advance(1); render();
  const go=()=>{ S.running=true; startLoop(); lastReal=performance.now(); render(); };
  if(withTut || !tutSeen()) runTutorial(go); else go();
}
function runTutorial(after){
  if(document.querySelector(".tut-card")) return;
  const wasRunning=!!(S&&S.running); if(S) S.running=false;
  let i=0, hl=null;
  const card=el("div",{class:"tut-card",role:"dialog","aria-modal":"false","aria-label":"新手教學"});
  document.body.append(card);
  const finish=()=>{ if(hl) hl.classList.remove("tut-hl"); card.remove(); window.removeEventListener("resize",place);
    try{ localStorage.setItem("np_tut","1"); }catch(_){}
    if(after) after(); else if(wasRunning&&S&&!S.ended){ S.running=true; lastReal=performance.now(); } renderLive(); };
  function place(){
    const st=TUT[i], t=st.sel&&document.querySelector(st.sel);
    card.classList.toggle("center",!t); card.style.left=card.style.top="";
    if(!t) return;
    const r=t.getBoundingClientRect(), cw=card.offsetWidth, ch=card.offsetHeight, m=12, vw=innerWidth, vh=innerHeight;
    let top = r.bottom+m+ch<vh ? r.bottom+m : (r.top-m-ch>0 ? r.top-m-ch : Math.max(m,Math.min(vh-ch-m, r.top+m)));
    let left = Math.max(m, Math.min(vw-cw-m, r.left + r.width/2 - cw/2));
    if(r.height>vh*0.45 && r.width<vw*0.6){ top=Math.max(m,Math.min(vh-ch-m, r.top+40)); left = r.right+m+cw<vw ? r.right+m : (r.left-m-cw>0 ? r.left-m-cw : left); }
    card.style.left=left+"px"; card.style.top=top+"px";
  }
  function show(){
    if(hl) hl.classList.remove("tut-hl");
    const st=TUT[i]; hl=st.sel&&document.querySelector(st.sel); if(hl){ hl.classList.add("tut-hl"); hl.scrollIntoView({block:"nearest"}); }
    const last=i===TUT.length-1;
    card.replaceChildren(el("div",{class:"step",text:`新手教學 ${i+1} / ${TUT.length}`}),el("h3",{text:st.title}),el("p",{text:st.text}),
      el("div",{class:"btnrow"},
        i>0? el("button",{class:"btn ghost",type:"button",onclick:()=>{i--;show();}},"上一步"):null,
        el("button",{class:"btn",type:"button",onclick:()=>{ if(last) finish(); else { i++; show(); } }}, last?"開始！":"下一步"),
        last? null : el("button",{class:"btn ghost",type:"button",onclick:finish},"跳過教學")));
    requestAnimationFrame(place); card.querySelector(".btn").focus();
  }
  window.addEventListener("resize",place);
  card.addEventListener("keydown",e=>{ if(e.key==="Escape") finish(); });
  show();
}
function showGlossary(){
  openPop(close=>el("div",{class:"popcard"},el("h3",{text:"名詞解釋"}),el("p",{class:"note",text:"點任何虛線底的字也能看說明。"}),
    el("div",{class:"glist"},Object.entries(GLOSS).map(([k,g])=>el("button",{type:"button",onclick:()=>{close();showTerm(k);}},g[0]))),
    el("div",{},el("button",{class:"btn ghost",type:"button",onclick:()=>{close();runTutorial();}},"再看一次新手教學")),
    el("div",{},el("button",{class:"btn ghost",onclick:close},"關閉"))));
}
document.addEventListener("click",e=>{ const t=e.target.closest&&e.target.closest(".term[data-term]"); if(t){ e.preventDefault(); e.stopPropagation(); showTerm(t.dataset.term);} },true);

const PRESSURE=["sprain_m20","fever_c8","cut_m55","panic_m35","fish_f45","fs_c2","drunk_m42"];
const INT={
  ignore:{label:"不理他，繼續問診",cost:0,anx:15,log:w=>`你沒有理會 ${w}`},
  scold:{label:"喝斥：「請回座位等，不要在這裡吵！」",cost:10,anx:25,log:w=>`你大聲請 ${w} 回座位`},

  explain:{label:"同理他的焦急，說明依嚴重程度看診（30 秒）",cost:30,anx:-20,log:w=>`你安撫 ${w}，說明會依嚴重程度看診`},
  letin:{label:"讓他插隊，馬上叫號",cost:0,anx:-10},
  guard:{label:"請保全協助，帶回候診區（30 秒）",cost:30,anx:15,log:w=>`你請保全把 ${w} 帶回候診區`}
};
/* 叫號後第一句話 */
const ATT_OPEN={ignore:"剛剛叫你都不理，現在才叫我們喔？",scold:"……剛剛那麼兇幹嘛。",observe:"謝謝你剛剛有過來看一下。",explain:"謝謝你剛剛跟我們說明。",letin:"早就該讓我們先看了。",guard:"叫保全是怎樣？我們又不是來鬧的。"};
/* 給 Claude 的情境說明 */
const ATT_PROMPT={
  ignore:"剛才他們朝檢傷台喊，護理師沒有理會。現在被叫到號，態度比較冷、不耐煩，會先抱怨剛剛被忽略。",
  scold:"剛才他們在候診區被護理師大聲喝斥。現在有點不爽又有點怕，回答簡短保留、不主動多說；家屬可能先酸一句。原本會主動插話的事，這次要被問到才說。",
  observe:"剛才護理師特地過來看了病人一眼，他們覺得被重視，會先道謝，比較願意配合、講得比較完整。",
  explain:"剛才護理師先安撫、說明了看診順序，他們情緒比較平穩、願意配合。",
  letin:"剛才他們硬闖檢傷台，護理師讓他們插隊。他們覺得吵就有用，態度比較強勢。",
  guard:"剛才保全把他們帶回候診區，他們很不滿、覺得被當成鬧事的人，態度防衛。"
};
function checkEvents(){
  if(!S.running||S.busy||S.ended||document.querySelector(".pop")||!S.cur) return;
  if(S.lastInt!=null && S.t-S.lastInt<240) return;   // 兩次打斷至少隔 4 分鐘（遊戲時間）
  const waiting=S.pts.filter(p=>p.status==="waiting"&&S.cur!==p);
  for(const p of waiting){
    const w=(S.t-arriveSec(p))/60;
    const quietWorse = !p.c.loud && stageOf(p)>=1 && p.c.family;
    if(!p.shouted && SHOUT[p.c.id] && (quietWorse || (p.c.loud && w>=15)) && Math.random()<0.025){ p.shouted=true; interrupt(p,"shout"); return; }
  }
  if(S.barge && !S.bargeDone){
    const p=waiting.find(p=>PRESSURE.includes(p.c.id) && (S.t-arriveSec(p))/60>=10 && !p.shouted);
    if(p && Math.random()<0.03){ S.bargeDone=true; p.shouted=true; interrupt(p,"barge"); }
  }
}
function interrupt(p,kind){
  const who=p.c.family? `${p.c.name}的${p.c.family.who}` : p.c.name;
  const ev={kind,name:who,t:S.t,choice:null,quiet:!p.c.loud,pid:p.c.id}; S.events.push(ev); S.lastInt=S.t;
  if(kind==="barge") intruder(true,p); else animShout(p);
  const waited=Math.round((S.t-arriveSec(p))/60);
  const line= kind==="barge"? `${who}直接走到檢傷台前拍桌：「我們等 ${waited} 分鐘了！先幫我們看！」`
                            : `${who}從候診區朝檢傷台大喊：「${SHOUT[p.c.id]||"我們到底還要等多久？"}」`;
  const keys= kind==="barge"? ["explain","observe","letin","scold","guard"] : ["ignore","scold","observe","explain"];
  const cur=S.cur;
  openPop(close=>el("div",{class:"popcard alarm"},
    el("h3",{text:kind==="barge"?"有人闖到檢傷台":"檢傷被打斷了"}),
    el("p",{text:`${clockStr(S.t)}　${line}`}),
    el("p",{class:"note",text:`你正在問 ${cur?cur.c.name:"別的病人"}。你要怎麼做？`}),
    el("div",{class:"choices"},keys.map(k=>el("button",{class:"btn ghost",onclick:()=>{
      const c=INT[k]; ev.choice=k; p.attitude=k; p.attSaid=false;
      p.anx=Math.max(0,Math.min(100,p.anx+c.anx));
      close(); intruder(false);
      if(k==="letin"){ callPatient(p); return; }
      if(k==="observe"){ cur&&cur.log.push({who:"sys",text:`你走到候診區看了 ${p.c.name} 一眼：${lookText(p)}${stageOf(p)>=1?"（看起來比剛到時差）":""}`}); play("#figN","lean"); }
      else if(c.log && cur) cur.log.push({who:"sys",text:c.log(who)});
      if(c.cost) advance(c.cost); render();
    }},c_label(k))))));
}
const c_label=k=>INT[k].label;
function bargeIn(p){ interrupt(p,"barge"); }
